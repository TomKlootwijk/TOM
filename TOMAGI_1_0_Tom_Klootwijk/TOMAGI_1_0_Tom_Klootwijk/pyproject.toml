[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tomagi"
version = "1.0.0"
description = "Topological Operator Machine for Analytic Geometric Inference"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Tom Klootwijk"}]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: C",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
validation = [
  "jsonschema>=4.18",
  "numpy>=1.26",
  "matplotlib>=3.8",
]

[project.scripts]
tomagi = "tomagi.cli:main"

[tool.setuptools]
package-dir = {"" = "src/python"}

[tool.setuptools.packages.find]
where = ["src/python"]
