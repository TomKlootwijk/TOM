[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tom-world-query-kernel"
version = "0.1.0"
description = "Persistent content-addressed world and exact discrete query kernel over TOMAGI 1.0"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Tom Klootwijk", email = "requester-supplied attribution"}]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: C",
  "Operating System :: OS Independent"
]

[project.scripts]
tomagi = "tomagi.cli:main"
tom-world = "tom_world.cli:main"

[tool.setuptools]
package-dir = {"" = "src/python"}

[tool.setuptools.packages.find]
where = ["src/python"]
